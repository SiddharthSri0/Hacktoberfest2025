<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Developer Profile Card</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }

    h2 {
      margin: 0.5rem 0;
    }

    .title {
      color: #555;
      font-size: 1rem;
      margin: 0.5rem 0;
    }

    .socials a {
      margin: 0 0.5rem;
      text-decoration: none;
      color: #0366d6;
      font-weight: bold;
    }

    button {
      background-color: #0366d6;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #024ea2;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://via.placeholder.com/150" alt="Profile Picture" class="avatar" />
    <h2>Umang Shukla</h2>
    <p class="title">Full Stack Developer</p>
    <p>India 🌏</p>
    <div class="socials">
      <a href="https://github.com/UMANG-SH941" target="_blank">GitHub</a>
      <a href="https://linkedin.com/in/umang-shukla-492144264" target="_blank">LinkedIn</a>
    </div>
    <p><button>Connect</button></p>
  </div>
</body>
</html>
